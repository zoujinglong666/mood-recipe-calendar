# mood-recipe-calendar 第二套 Docker 部署
# 与第一套（另一个小程序）同服务器，后端宿主机端口 8123，不与第一套 8080 冲突
#
# 使用前：
#   1. 复制 .env.example 为 .env，填入真实密钥
#   2. 本地构建：cd backend && mvn package -DskipTests && cd ../frontend && pnpm build:h5
#   3. 上传整个项目到服务器（或至少 backend/target、frontend/dist、docker/、docker-compose.yml、.env）
#   4. 建库：mysql -uroot -p -e "CREATE DATABASE mood_recipe CHARACTER SET utf8mb4;" && mysql -uroot -p mood_recipe < backend/sql/init.sql
#   5. docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mood-recipe-backend
    expose:
      - "8080"
    env_file:
      - .env
    # Linux 服务器连宿主机 MySQL 需要这行；如果 MySQL 在第一套容器里，改用 external_networks 加入第一套网络
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: mood-recipe-nginx
    ports:
      - "8123:80"
    volumes:
      - ./frontend/dist/build/h5:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# 如果第一套 MySQL 在 Docker 容器里，取消下面注释并把第一套网络名填进去，
# 然后在 .env 里把 DB_HOST 设为第一套 MySQL 容器名。
# networks:
#   default:
#     external: true
#     name: 第一套的docker网络名

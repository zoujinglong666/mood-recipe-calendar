spring.application.name=mood-recipe-backend
server.port=8080

# ========== MySQL 数据源 ==========
# Docker 部署时通过 DB_HOST/DB_PORT/DB_NAME 指向第一套 MySQL 容器或宿主机 MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mood_recipe}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 每条连接强制 utf8mb4：即使部署环境用 SPRING_DATASOURCE_URL 覆盖掉 URL 参数，
# 也不会退化成 latin1 导致中文写入乱码（characterEncoding 只认 Java 字符集名 utf8，utf8mb4 需靠 connectionCollation/连接初始化指定）
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=update
# 生产环境默认关闭 SQL 日志；开发调试时设 JPA_SHOW_SQL=true 打开
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ========== 文件上传 ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=./uploads
# 对外访问域名优先级：upload.public-base-url > tencent.cos.domain > COS 默认域名
upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:}
# 腾讯云 COS：密钥通过环境变量或 backend/.env 提供（.env 已 gitignore），绝不提交仓库。
tencent.cos.enabled=${TENCENT_COS_ENABLED:true}
tencent.cos.secret-id=${TENCENT_COS_SECRET_ID:}
tencent.cos.secret-key=${TENCENT_COS_SECRET_KEY:}
tencent.cos.region=${TENCENT_COS_REGION:ap-guangzhou}
tencent.cos.bucket=${TENCENT_COS_BUCKET:lq-picture-1367878423}
# 项目前缀：本 bucket 为多项目共用，所有 key 统一加 mood-recipe/ 区分，避免与其他项目文件冲突。
tencent.cos.prefix=${TENCENT_COS_PREFIX:mood-recipe/}
# 场景子目录：普通图片（菜品/记录照片）与用户头像分开存放。
tencent.cos.image-dir=${TENCENT_COS_IMAGE_DIR:uploads/}
tencent.cos.avatar-dir=${TENCENT_COS_AVATAR_DIR:avatar/}
# COS 自定义/回源 CDN 域名（bucket 公共读时可直接访问）
tencent.cos.domain=${TENCENT_COS_DOMAIN:static.image-zero.art}
# 加载 backend/.env（本地密钥等，不提交 git）
spring.config.import=optional:file:./.env[.properties]

# ========== 微信小程序配置 ==========
# 本地开发默认值；部署环境通过环境变量 WECHAT_APPID / WECHAT_SECRET 覆盖。
wechat.appid=${WECHAT_APPID:wx4da25d0ce1a4938c}
wechat.secret=${WECHAT_SECRET:}
wechat.content-safety.enabled=${WECHAT_CONTENT_SAFETY_ENABLED:false}
wechat.content-safety.fail-closed=${WECHAT_CONTENT_SAFETY_FAIL_CLOSED:false}
# 小程序订阅消息：模板 ID 不是密钥；AppID/AppSecret 仍只从环境变量读取。
wechat.subscription.template-id=${WECHAT_SUBSCRIBE_TEMPLATE_ID:h00FlM2Xf_X64sXln5WoYGnbvtJBjasdEraRPjs4NOg}
# 冰箱临期提醒订阅消息模板（会员专享）。需在微信公众平台「订阅消息」中新建模板后将 ID 配置到这里。
wechat.subscription.fridge-template-id=${WECHAT_SUBSCRIBE_FRIDGE_TEMPLATE_ID:}
wechat.subscription.miniprogram-state=${WECHAT_SUBSCRIBE_MINIPROGRAM_STATE:formal}

# ========== 微信虚拟支付（个人小程序）==========
# 仅在部署环境中设置下列变量，绝不能提交 OfferID/AppKey 或 session_key 加密密钥。
# 商品道具 ID 在 virtual_products.platform_item_id 中维护，必须与后台道具管理一致。
wechat.virtual-payment.offer-id=${WECHAT_VIRTUAL_PAYMENT_OFFER_ID:}
wechat.virtual-payment.app-key=${WECHAT_VIRTUAL_PAYMENT_APP_KEY:}
wechat.virtual-payment.environment=${WECHAT_VIRTUAL_PAYMENT_ENV:0}
wechat.virtual-payment.reconcile-delay-ms=${WECHAT_VIRTUAL_PAYMENT_RECONCILE_DELAY_MS:300000}
wechat.virtual-payment.reconcile-initial-delay-ms=${WECHAT_VIRTUAL_PAYMENT_RECONCILE_INITIAL_DELAY_MS:60000}
# 微信小程序后台「消息推送」中配置的 Token；用于校验异步发货通知。
wechat.message-push.token=${WECHAT_MESSAGE_PUSH_TOKEN:}
wechat.message-push.encoding-aes-key=${WECHAT_MESSAGE_PUSH_ENCODING_AES_KEY:}
# Base64 编码的 32 字节随机密钥，用于在数据库中加密 session_key。
wechat.session-key-encryption-key=${WECHAT_SESSION_KEY_ENCRYPTION_KEY:}
security.session.days=${SESSION_DAYS:30}

# ========== Jackson ==========
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ========== Agnes AI 文本菜谱 ==========
# 文本与图片共用后端环境变量 AGNES_API_KEY；不得把真实密钥提交到仓库。
ai.recipe.api-key=${AGNES_API_KEY:}
ai.recipe.base-url=${AI_RECIPE_BASE_URL:https://apihub.agnes-ai.com/v1/chat/completions}
ai.recipe.model=${AI_RECIPE_MODEL:agnes-3.0-flash}
ai.llm.primary-model=${AGNES_PRIMARY_MODEL:agnes-3.0-flash}
ai.llm.fallback-model=${AGNES_FALLBACK_MODEL:agnes-2.5-flash}
# 冰箱拍照识别用的视觉（多模态）模型；留空则识别功能自动降级提示，不影响其他功能。
ai.vision.model=${AI_VISION_MODEL:}

# 锅仔联网搜索（会员专享）。留空则 web_search 工具自动降级，不影响锅仔其他回答。
search.api-key=${SEARCH_API_KEY:}
search.tavily-endpoint=${SEARCH_TAVILY_ENDPOINT:https://api.tavily.com/search}
ai.cooking-agent.enabled=${AI_COOKING_AGENT_ENABLED:true}

# ========== 智谱官方 Embedding（膳食指南 RAG 向量化）==========
# 离线抽取与运行时查询都走 open.bigmodel.cn；Key 通过环境变量注入，不入库。
zhipu.embedding.api-key=${ZHIPU_API_KEY:}
zhipu.embedding.base-url=${ZHIPU_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
zhipu.embedding.model=${ZHIPU_EMBEDDING_MODEL:embedding-2}

# ========== Agnes AI 菜谱封面 ==========
# 仅后端读取 AGNES_API_KEY；制图失败时仍正常返回菜谱正文。
ai.recipe-image.api-key=${AGNES_API_KEY:}
ai.recipe-image.base-url=${AGNES_IMAGE_BASE_URL:https://apihub.agnes-ai.com/v1/images/generations}
ai.recipe-image.model=${AGNES_IMAGE_MODEL:agnes-image-2.5-flash}
ai.recipe-image.size=${AGNES_IMAGE_SIZE:1K}
ai.recipe-image.ratio=${AGNES_IMAGE_RATIO:4:3}

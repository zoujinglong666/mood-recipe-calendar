spring.application.name=mood-recipe-backend
server.port=8080

# ========== MySQL 数据源 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mood_recipe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========== 文件上传 ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=./uploads

# ========== 微信小程序配置 ==========
# 配置真实 AppID/AppSecret 后，小程序 code 走微信 code2session；
# code 带 h5_dev_ 前缀仍走 mock（H5 本地开发调试）
wechat.appid=wx4da25d0ce1a4938c
wechat.secret=cb738ee73061756874a44461066cbc10

# ========== Jackson ==========
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
